<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">
  <!-- ChoCo membership cascade for the 15 venues, 2026-09-26 (after the GLM-5.3 / v6 re-read). Numbers from corpus4_tally.py. -->
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7d4f"/></marker>
  </defs>
  <rect width="760" height="520" fill="#ffffff"/>

  <!-- stages -->
  <g fill="#f4f5f7" stroke="#c9ced6">
    <rect x="80" y="20" width="330" height="54" rx="6"/>
    <rect x="80" y="112" width="330" height="54" rx="6"/>
    <rect x="80" y="204" width="330" height="78" rx="6"/>
    <rect x="80" y="320" width="330" height="54" rx="6"/>
  </g>
  <g fill="#1f2530">
    <text x="96" y="43" font-weight="600">82,290 papers</text>
    <text x="96" y="62" fill="#5b6472">every DBLP paper of 15 venues, 1960s–2026</text>
    <text x="96" y="135" font-weight="600">Is there an abstract?</text>
    <text x="96" y="154" fill="#5b6472">a title alone is not enough to judge</text>
    <text x="96" y="227" font-weight="600">Embedding classifier</text>
    <text x="96" y="246" fill="#5b6472">free, trained on earlier verdicts</text>
    <text x="96" y="343" font-weight="600">Language model reads the abstract</text>
    <text x="96" y="362" fill="#5b6472">quotes its evidence; the costly stage</text>
  </g>
  <!-- classifier split bar, widths proportional to 58,521 / 14,037 / 4,593 of 77,151 -->
  <rect x="96" y="256" width="227.6" height="14" fill="#8a929e"/>
  <rect x="323.6" y="256" width="54.6" height="14" fill="#d9a441"/>
  <rect x="378.2" y="256" width="17.8" height="14" fill="#2f7d4f"/>

  <!-- flow down -->
  <g stroke="#5b6472" stroke-width="1.5" fill="none" marker-end="url(#ah)">
    <line x1="245" y1="74" x2="245" y2="110"/>
    <line x1="245" y1="166" x2="245" y2="202"/>
    <line x1="351" y1="282" x2="351" y2="318"/>
  </g>
  <g fill="#5b6472" font-size="12">
    <text x="253" y="189">77,151 with an abstract</text>
    <text x="359" y="305">14,037 unsure</text>
  </g>

  <!-- exits to the right -->
  <g stroke="#5b6472" stroke-width="1.5" fill="none" marker-end="url(#ah)">
    <line x1="410" y1="139" x2="498" y2="139" stroke-dasharray="4 3"/>
    <line x1="410" y1="236" x2="498" y2="236"/>
    <line x1="410" y1="347" x2="498" y2="347"/>
  </g>
  <g>
    <rect x="500" y="118" width="220" height="42" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-dasharray="4 3"/>
    <text x="514" y="136" font-weight="600" fill="#1f2530">5,139 set aside, unscored</text>
    <text x="514" y="152" font-size="12" fill="#5b6472">counted separately, never as “out”</text>
    <rect x="500" y="215" width="220" height="42" rx="6" fill="#eceef1" stroke="#c9ced6"/>
    <text x="514" y="233" font-weight="600" fill="#1f2530">58,521 out</text>
    <text x="514" y="249" font-size="12" fill="#5b6472">probability below 2%</text>
    <rect x="500" y="326" width="220" height="42" rx="6" fill="#eceef1" stroke="#c9ced6"/>
    <text x="514" y="344" font-weight="600" fill="#1f2530">13,030 out</text>
    <text x="514" y="360" font-size="12" fill="#5b6472">outside the definition</text>
  </g>

  <!-- in: a rail on the left collecting both stages -->
  <g stroke="#2f7d4f" stroke-width="1.8" fill="none">
    <path d="M80 262 H48 V420"/>
    <path d="M80 356 H48"/>
    <line x1="48" y1="420" x2="78" y2="420" marker-end="url(#ahg)"/>
  </g>
  <g fill="#2f7d4f" font-size="12" text-anchor="end">
    <text x="44" y="258">4,593</text>
    <text x="44" y="352">5,006</text>
  </g>
  <rect x="80" y="398" width="330" height="46" rx="6" fill="#e7f2eb" stroke="#2f7d4f"/>
  <text x="96" y="420" font-weight="700" fill="#1f5c38">9,599 in the field</text>
  <text x="96" y="436" font-size="12" fill="#2f5a40">machine judgments, preliminary</text>

  <!-- people -->
  <rect x="500" y="398" width="220" height="80" rx="6" fill="#ffffff" stroke="#8a6fb0" stroke-dasharray="2 3"/>
  <text x="514" y="418" font-weight="600" fill="#4b3a6b">People check every stage</text>
  <text x="514" y="436" font-size="12" fill="#5b6472">277 hand-labeled papers and</text>
  <text x="514" y="452" font-size="12" fill="#5b6472">64 workshop papers measure it;</text>
  <text x="514" y="468" font-size="12" fill="#5b6472">blind audits sample each band</text>

  <!-- legend for the split bar -->
  <g font-size="11" fill="#5b6472">
    <rect x="96" y="492" width="10" height="10" fill="#8a929e"/><text x="111" y="501">out, p &lt; 2%</text>
    <rect x="196" y="492" width="10" height="10" fill="#d9a441"/><text x="211" y="501">unsure, to the language model</text>
    <rect x="390" y="492" width="10" height="10" fill="#2f7d4f"/><text x="405" y="501">in, p ≥ 95%</text>
  </g>
</svg>
